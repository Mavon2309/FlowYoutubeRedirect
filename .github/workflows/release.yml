name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content plugin.json -Raw | ConvertFrom-Json
          $tag = "v$($manifest.Version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match plugin version $($manifest.Version)"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install packaged dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt --target lib

      - name: Build Flow Launcher package
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Create version tag when run manually
        if: github.ref_type != 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            git tag $env:RELEASE_TAG
            git push origin $env:RELEASE_TAG
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG FlowYoutubeRedirect.zip --clobber
          }
          else {
            gh release create $env:RELEASE_TAG FlowYoutubeRedirect.zip `
              --title "FlowYoutubeRedirect $env:RELEASE_TAG" `
              --generate-notes
          }
